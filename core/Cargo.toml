[package]
# Not named `core`: that would shadow Rust's built-in `core` crate, which
# derive and format macros reference as `::core::...`.
name = "worldgen-core"
description = "Deterministic world generation logic, free of UI dependencies."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
noise.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
# Platform-independent maths (exp, powf, sin...) so worlds are identical
# on every OS and on wasm.
libm = "0.2"
rayon = { workspace = true, optional = true }

[features]
# Simulate erosion chunks on all cores. Output is identical either way.
# Not available on wasm32-unknown-unknown, which has no threads.
parallel = ["dep:rayon"]

