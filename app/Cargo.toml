[package]
name = "worldgen-app"
description = "eframe UI for the procedural world generator."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "worldgen"
path = "src/main.rs"

[dependencies]
worldgen-core.workspace = true
eframe.workspace = true
# Renders map lettering into the style canvas (pure Rust, works on wasm).
ab_glyph = "0.2"
# PNG encoding for map export (pure Rust, works on wasm).
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
worldgen-core = { workspace = true, features = ["parallel"] }
# Native save dialogs for exports.
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Location", "History", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement"] }
